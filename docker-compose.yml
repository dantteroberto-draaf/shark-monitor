version: '3.8'

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
      network: host # <-- ADICIONE ESTA LINHA AQUI
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
      network: host # <-- E ADICIONE ESTA LINHA AQUI TAMBÉM
    ports:
      - "3333:3333"
    volumes:
      - ./api:/app
      - /app/node_modules
    environment:
      - PORT=3333
      - DATABASE_URL=postgresql://postgres:docker@db:5432/sharkmonitor

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=docker
      - POSTGRES_DB=sharkmonitor
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: